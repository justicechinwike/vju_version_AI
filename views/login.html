<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | VJU Vision AI</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="auth-shell">
    <section class="brand-panel">
      <div class="brand-mark">J</div>
      <h1>VJU VISION AI</h1>
      <p>Educational screen recognition and trading intelligence.</p>
    </section>
    <form class="auth-card" id="loginForm">
      <h2>Welcome back</h2>
      <p>Sign in to your command centre.</p>
      <label>Email address<input id="email" type="email" autocomplete="email" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <div id="message" class="message" role="alert"></div>
      <a href="/register">Create an account</a>
    </form>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
